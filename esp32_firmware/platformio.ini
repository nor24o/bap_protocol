[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can @ ^1.5.0
build_flags =
    -D CAN_CS_PIN=5
    -D CAN_INT_PIN=4
    ; Set to MCP_8MHZ or MCP_16MHZ depending on the silver crystal on your MCP2515 module
    -D CAN_OSC_MHZ=MCP_8MHZ
